<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QA Expertise — Abid Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
.hero-sm{min-height:30vh;background:radial-gradient(circle at 30% 40%,rgba(99,102,241,0.20),transparent 60%),var(--bg-dark);display:flex;align-items:center;}
.ex-card{position:relative;background:#12172e;border:1px solid #23283f;border-radius:1rem;padding:1.75rem;transition:.2s;margin-bottom:1rem;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.ex-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--primary),var(--primary-2));border-radius:1rem 0 0 1rem;}
.ex-card:hover{transform:translateY(-4px);border-color:#334155;}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top glass-nav" aria-label="Main"><div class="container-fluid px-4 px-lg-5"><a class="navbar-brand fw-bold text-gradient" href="index.html">Abid Ali</a><button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#navMenu"><i class="fa-solid fa-bars-staggered"></i></button><div class="collapse navbar-collapse" id="navMenu"><ul class="navbar-nav ms-auto gap-lg-2"><li><a class="nav-link" href="index.html#home">Home</a></li><li><a class="nav-link" href="expertise.html">Expertise</a></li><li><a class="nav-link" href="index.html#projects">Projects</a></li><li><a class="nav-link" href="contact.html">Contact</a></li></ul></div></div></nav>
<section class="hero-sm" aria-label="Header"><div class="container text-center"><h1 class="fw-extrabold display-5">QA Expertise</h1><p class="text-white-75">Manual Testing, POS, API, Database, Cross-Platform</p></div></section>
<section class="py-5" aria-label="Full Expertise" style="padding-top:6rem;"><div class="container"><div class="row g-3 justify-content-center" id="expGrid"></div>
<script>
const exp = [
  {icon:'fa-clipboard-check',t:'Manual Testing',d:'End-to-end validation of software functionality.'},
  {icon:'fa-gears',t:'Functional Testing',d:'Verifying features work as intended.'},
  {icon:'fa-right-left',t:'Regression Testing',d:'Re-testing after changes to prevent defects.'},
  {icon:'fa-fire-flame-curved',t:'Smoke Testing',d:'Quick core functionality checks.'},
  {icon:'fa-check-double',t:'Sanity Testing',d:'Focused verification of fixed areas.'},
  {icon:'fa-palette',t:'UI/UX Testing',d:'Layout, usability and accessibility checks.'},
  {icon:'fa-network-wired',t:'API Testing',d:'Endpoint validation with Postman.'},
  {icon:'fa-database',t:'Database Testing',d:'SQL queries and data integrity.'},
  {icon:'fa-globe',t:'Cross-Browser Testing',d:'Chrome, Firefox, Edge, Safari.'},
  {icon:'fa-mobile-screen',t:'Cross-Platform Testing',d:'Windows, macOS, iOS, Android.'},
  {icon:'fa-bug-slash',t:'Bug Reporting',d:'Clear reproducible bug reports.'},
  {icon:'fa-file-lines',t:'Test Case Design',d:'Structured maintainable test cases.'}
];
document.getElementById('expGrid').innerHTML = exp.map((e,i)=>`<div class="col-6 col-md-3"><div class="ex-card h-100"><i class="fa-solid ${e.icon} fa-xl text-gradient mb-2"></i><h5 class="h6 fw-bold">${e.t}</h5><p class="small text-white-75 mb-0">${e.d}</p></div></div>`).join('');
</script></section>
<footer class="py-3 text-center text-white-50 small">Abid Ali — QA Engineer</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
